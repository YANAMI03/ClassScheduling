<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Confirming Email - Scheduler</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/boxicons@latest/css/boxicons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
    <style>
        .callback-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--body-bg);
            padding: 1rem;
        }
        .callback-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow-lg);
            padding: 2.5rem;
            width: 100%;
            max-width: 420px;
            text-align: center;
        }
        .callback-card i {
            font-size: 2.75rem;
            color: var(--primary);
            margin-bottom: 1rem;
        }
        .callback-card h4 {
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
        }
        .callback-card p {
            color: var(--text-secondary);
            font-size: 0.875rem;
            margin-bottom: 1.5rem;
        }
    </style>
</head>
<body>
    <div class="callback-wrapper">
        <div class="callback-card">
            <div id="loadingState">
                <div class="spinner-border text-primary mb-3" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
                <h4>Verifying your account...</h4>
                <p>Please wait while we complete your email verification.</p>
            </div>
            <div id="errorState" class="hidden">
                <i class="bx bx-error-circle text-danger"></i>
                <h4 id="errorHeading">Verification Failed</h4>
                <p id="errorText">The verification link is invalid or expired.</p>
                <a href="{{ url_for('login', active_tab='resend') }}" class="btn btn-primary w-100">
                    <i class="bx bx-envelope me-2"></i> Resend Verification Email
                </a>
            </div>
        </div>
    </div>
    <script>
        (function() {
            var hash = window.location.hash.substring(1);
            var params = new URLSearchParams(hash);
            var accessToken = params.get('access_token');
            var refreshToken = params.get('refresh_token');
            var error = params.get('error') || params.get('error_description');

            if (error) {
                document.getElementById('loadingState').classList.add('hidden');
                document.getElementById('errorState').classList.remove('hidden');
                document.getElementById('errorText').textContent = error;
                return;
            }

            if (accessToken) {
                fetch("{{ url_for('auth_callback') }}", {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        access_token: accessToken,
                        refresh_token: refreshToken
                    })
                })
                .then(function(res) { return res.json(); })
                .then(function(data) {
                    if (data && data.success && data.redirect_url) {
                        window.location.href = data.redirect_url;
                    } else {
                        window.location.href = "{{ url_for('login') }}";
                    }
                })
                .catch(function(err) {
                    window.location.href = "{{ url_for('login') }}";
                });
            } else {
                // No token in hash and no query params; redirect to login
                window.location.href = "{{ url_for('login') }}";
            }
        })();
    </script>
</body>
</html>
