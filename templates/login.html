<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - Scheduler</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/boxicons@latest/css/boxicons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
    <style>
        .login-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--body-bg);
            padding: 1rem;
        }

        .login-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow-lg);
            padding: 2.5rem;
            width: 100%;
            max-width: 420px;
        }

        .login-card__brand {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            justify-content: center;
            margin-bottom: 0.5rem;
        }

        .login-card__brand i {
            font-size: 2rem;
            color: var(--primary);
        }

        .login-card__brand h3 {
            font-weight: 700;
            margin: 0;
            color: var(--text-primary);
        }

        .login-card__subtitle {
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.875rem;
            margin-bottom: 1.75rem;
        }

        .login-card .form-label {
            font-weight: 500;
            font-size: 0.875rem;
            color: var(--text-primary);
            margin-bottom: 0.375rem;
        }

        .login-card .form-control {
            padding: 0.625rem 0.875rem;
            border-radius: var(--radius-sm);
            border-color: var(--border-color);
            font-size: 0.938rem;
            transition: var(--transition);
        }

        .login-card .form-control:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        .login-card .btn-primary {
            width: 100%;
            padding: 0.625rem;
            font-weight: 600;
            border-radius: var(--radius-sm);
            font-size: 0.938rem;
        }

        .login-error {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #dc2626;
            padding: 0.625rem 1rem;
            border-radius: var(--radius-sm);
            font-size: 0.875rem;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .login-error i {
            font-size: 1.125rem;
            flex-shrink: 0;
        }

        .login-toggle {
            text-align: center;
            margin-top: 1rem;
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .login-toggle a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
        }

        .login-toggle a:hover {
            text-decoration: underline;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>
    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-card__brand">
                <i class="bx bx-calendar-alt"></i>
                <h3>Scheduler</h3>
            </div>
            <p class="login-card__subtitle" id="formSubtitle">Sign in to manage class schedules</p>

            {% if error %}
            <div class="login-error">
                <i class="bx bx-error-circle"></i>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <!-- Login Form -->
            <form method="post" action="{{ url_for('login') }}" id="loginForm">
                <div class="mb-3">
                    <label for="username" class="form-label">Username or Email</label>
                    <input type="text" id="username" name="username" class="form-control" placeholder="Enter your username or email"
                        required autofocus>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" id="password" name="password" class="form-control"
                        placeholder="Enter your password" required>
                </div>
                <button type="submit" class="btn btn-primary">
                    <i class="bx bx-log-in me-2"></i> Sign In
                </button>
                <div class="login-toggle">
                    Don't have an account? <a href="#" id="showSignup">Sign Up</a>
                </div>
            </form>

            <!-- Sign Up Form -->
            <form method="post" action="{{ url_for('signup') }}" id="signupForm" class="hidden">
                <div class="mb-3">
                    <label for="firstName" class="form-label">First Name</label>
                    <input type="text" id="firstName" name="first_name" class="form-control"
                        placeholder="Enter your first name" required>
                </div>
                <div class="mb-3">
                    <label for="lastName" class="form-label">Last Name</label>
                    <input type="text" id="lastName" name="last_name" class="form-control"
                        placeholder="Enter your last name" required>
                </div>
                <div class="mb-3">
                    <label for="program" class="form-label">Program</label>
                    <select id="program" name="program" class="form-control" required>
                        <option value="">Select Program</option>
                        <option value="BSIT">BSIT</option>
                        <option value="BSBA">BSBA</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label for="signupUsername" class="form-label">Username or Email</label>
                    <input type="text" id="signupUsername" name="username" class="form-control" placeholder="Choose a username or email"
                        required>
                </div>
                <div class="mb-3">
                    <label for="signupPassword" class="form-label">Password</label>
                    <input type="password" id="signupPassword" name="password" class="form-control"
                        placeholder="Choose a password" required>
                </div>
                <div class="mb-3">
                    <label for="confirmPassword" class="form-label">Confirm Password</label>
                    <input type="password" id="confirmPassword" name="confirm_password" class="form-control"
                        placeholder="Confirm your password" required>
                </div>
                <button type="submit" class="btn btn-primary">
                    <i class="bx bx-user-plus me-2"></i> Sign Up
                </button>
                <div class="login-toggle">
                    Already have an account? <a href="#" id="showLogin">Sign In</a>
                </div>
            </form>
        </div>
    </div>
    <script>
        document.getElementById('showSignup').addEventListener('click', function (e) {
            e.preventDefault();
            document.getElementById('loginForm').classList.add('hidden');
            document.getElementById('signupForm').classList.remove('hidden');
            document.getElementById('formSubtitle').textContent = 'Create a new account';
        });

        document.getElementById('showLogin').addEventListener('click', function (e) {
            e.preventDefault();
            document.getElementById('signupForm').classList.add('hidden');
            document.getElementById('loginForm').classList.remove('hidden');
            document.getElementById('formSubtitle').textContent = 'Sign in to manage class schedules';
        });

        document.getElementById('signupForm').addEventListener('submit', function (e) {
            var password = document.getElementById('signupPassword').value;
            var confirmPassword = document.getElementById('confirmPassword').value;

            if (password !== confirmPassword) {
                e.preventDefault();
                alert('Passwords do not match.');
                return false;
            }
        });
    </script>
</body>

</html>
